# Builds the AS-REP roasting DC on a Fedora VM -- the VM form of the same lab the container form
# (build/dc) builds. Run from Isoloom's Ansible controller over SSH on the VM targets; SKIPPED on
# the docker target, where the container self-configures from its Dockerfile.
#
# Fedora, because its Samba is built against the MIT KDC, which honours UF_DONT_REQUIRE_PREAUTH --
# the no-pre-auth roast works here exactly as in the container (and as against a real Windows DC).
# Debian/Ubuntu Samba is Heimdal and would answer KDC_ERR_PREAUTH_REQUIRED.
#
# Mirrors build/dc/{Dockerfile,entrypoint.sh}: install Samba AD + the impacket roast tooling,
# provision LAKESIDE.LAB, create ordinary staff plus the pre-auth-disabled svc-scanner, plant the
# flag in an imaging share only svc-scanner may read, and run the AD DC as a systemd service. The
# same /opt/asrep/check.sh then proves the lab from inside the DC, on this form as on the container.
- name: AS-REP roasting Fedora Samba AD DC (LAKESIDE.LAB)
  hosts: dc
  become: true
  gather_facts: false
  vars:
    realm: LAKESIDE.LAB
    domain: LAKESIDE
    # DC administrator password: infrastructure only, never shown to the student.
    admin_pass: "DCAdm1n#Lakeside2024"
    # The roastable account: pre-auth disabled, weak wordlist-crackable password.
    nopreauth_user: svc-scanner
    nopreauth_pass: Scanner2021
    # Ordinary staff: pre-auth ON, strong random passwords. Decoys in the username list.
    decoys: [j.okoro, a.mensah, r.kaplan, d.ferreira, l.nguyen]
    private_dir: /var/lib/samba/private
    asrep_dir: /opt/asrep
    venv: /opt/impacket-venv
    build_dc: "{{ playbook_dir }}/../build/dc"
    # userAccountControl: NORMAL_ACCOUNT (0x200) | DONT_REQ_PREAUTH (0x400000) = 0x400200.
    uac_nopreauth: 4194816
  tasks:
    # --- host prep: a single-host lab DC, reachable, Samba AD unconfined ---
    - name: SELinux permissive now
      ansible.builtin.command: setenforce 0
      changed_when: false
      failed_when: false

    - name: SELinux permissive on next boot too
      ansible.builtin.lineinfile:
        path: /etc/selinux/config
        regexp: '^SELINUX='
        line: 'SELINUX=permissive'
      failed_when: false

    - name: No host firewall in the way of the AD services
      ansible.builtin.systemd:
        name: firewalld
        state: stopped
        enabled: false
      failed_when: false

    # --- packages: the AD DC + the roast client tooling the check uses (mirrors the Dockerfile) ---
    - name: AD DC + roast client tooling
      ansible.builtin.dnf:
        name:
          - samba
          - samba-dc
          - samba-client
          - samba-common-tools
          - ldb-tools
          - krb5-workstation
          - python3
          - python3-pip
          - bind-utils
          - procps-ng
          - iproute
          - findutils
          - diffutils
          - gawk
          - sed
          - ca-certificates
        state: present
        install_weak_deps: false

    - name: impacket (pinned) in its own venv
      ansible.builtin.pip:
        name:
          - wheel
          - impacket==0.13.1
        virtualenv: "{{ venv }}"
        virtualenv_command: python3 -m venv

    - name: Lab asset directory
      ansible.builtin.file:
        path: "{{ asrep_dir }}"
        state: directory
        mode: "0755"

    - name: Ship the roast tooling and wordlists the check reads
      ansible.builtin.copy:
        src: "{{ build_dc }}/{{ item.name }}"
        dest: "{{ asrep_dir }}/{{ item.name }}"
        mode: "{{ item.mode }}"
      loop:
        - { name: vault-share.conf, mode: "0644" }
        - { name: wordlist.txt, mode: "0644" }
        - { name: users.txt, mode: "0644" }
        - { name: crack.py, mode: "0755" }
        - { name: check.sh, mode: "0755" }

    # --- provision the realm once (idempotent via sam.ldb / stamp) ---
    - name: Has the realm already been provisioned?
      ansible.builtin.stat:
        path: "{{ private_dir }}/.isoloom-provisioned"
      register: stamp

    - name: Provision LAKESIDE.LAB (once)
      when: not stamp.stat.exists
      block:
        - name: No standalone smb.conf before provisioning
          ansible.builtin.file:
            path: /etc/samba/smb.conf
            state: absent

        - name: samba-tool domain provision
          # "ldap server require strong auth = no" lets the student enumerate over plain LDAP.
          ansible.builtin.shell: |
            samba-tool domain provision \
              --use-rfc2307 \
              --realm="{{ realm }}" \
              --domain="{{ domain }}" \
              --server-role=dc \
              --dns-backend=SAMBA_INTERNAL \
              --host-name=dc \
              --adminpass="{{ admin_pass }}" \
              --option="ldap server require strong auth = no"
          args:
            executable: /bin/bash
            creates: "{{ private_dir }}/sam.ldb"

        - name: Kerberos client config from the provisioned realm
          ansible.builtin.copy:
            src: "{{ private_dir }}/krb5.conf"
            dest: /etc/krb5.conf
            remote_src: true
            mode: "0644"

        - name: Publish the imaging share that guards the flag
          ansible.builtin.blockinfile:
            path: /etc/samba/smb.conf
            marker: "# {mark} isoloom imaging share"
            block: "{{ lookup('file', build_dc + '/vault-share.conf') }}"

        - name: Mark provisioned
          ansible.builtin.file:
            path: "{{ private_dir }}/.isoloom-provisioned"
            state: touch
            mode: "0644"

    # --- resolver points at the DC's own internal DNS (the check talks to it as dc / 127.0.0.1) ---
    - name: Stop systemd-resolved so the DC manages its own resolver
      ansible.builtin.systemd:
        name: systemd-resolved
        state: stopped
        enabled: false
      failed_when: false

    - name: Drop any resolv.conf symlink
      ansible.builtin.file:
        path: /etc/resolv.conf
        state: absent

    - name: Resolver -> the DC's internal DNS
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        content: "nameserver 127.0.0.1\nsearch lakeside.lab\n"
        mode: "0644"

    - name: The DC resolves its own name
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "127.0.0.1 dc.lakeside.lab dc"
        regexp: 'dc\.lakeside\.lab'

    # --- accounts, created offline against sam.ldb (works whether or not samba is running) ---
    - name: Ordinary hospital staff (pre-auth ON, decoys in the username list)
      ansible.builtin.shell: |
        set -o pipefail
        if ! samba-tool user list | grep -qx "{{ item }}"; then
          samba-tool user create "{{ item }}" "Zz9$(tr -dc 'A-Za-z0-9' </dev/urandom | head -c 20)"
        fi
      args:
        executable: /bin/bash
      register: decoy
      changed_when: "'Created' in decoy.stderr or 'User' in decoy.stdout"
      loop: "{{ decoys }}"

    - name: Legacy document-scanner service account
      ansible.builtin.shell: |
        set -o pipefail
        if ! samba-tool user list | grep -qx "{{ nopreauth_user }}"; then
          samba-tool user create "{{ nopreauth_user }}" "{{ nopreauth_pass }}" \
            --description="Legacy document-scanner integration (pre-auth disabled for an old app)"
        fi
      args:
        executable: /bin/bash
      register: svc
      changed_when: "'Created' in svc.stderr or 'User' in svc.stdout"

    - name: Disable Kerberos pre-authentication on svc-scanner (offline, against sam.ldb)
      # Written offline against sam.ldb before the KDC starts: the running KDC enforces samba's ldap
      # constraints on userAccountControl, an offline ldbmodify does not. The account keeps its
      # default AES keys, so the roast yields a $krb5asrep$18$ hash (crack with john / crack.py).
      ansible.builtin.shell: |
        set -euo pipefail
        dn="$(samba-tool user show "{{ nopreauth_user }}" | awk -F': ' '/^dn:/{print $2; exit}')"
        printf 'dn: %s\nchangetype: modify\nreplace: userAccountControl\nuserAccountControl: {{ uac_nopreauth }}\n' "$dn" \
          | ldbmodify -H "{{ private_dir }}/sam.ldb"
      args:
        executable: /bin/bash
      changed_when: true

    - name: Passwords never expire (the lab behaves the same on day 1 and day 60)
      ansible.builtin.command: "samba-tool user setexpiry {{ item }} --noexpiry"
      changed_when: false
      failed_when: false
      loop: "{{ decoys + [nopreauth_user] }}"

    # --- the flag, into the imaging share, from the sensitive input at /ctf/flag ---
    - name: Plant the flag in the imaging share (readable only by svc-scanner)
      ansible.builtin.shell: |
        set -euo pipefail
        mkdir -p /srv/imaging
        if [ -s /ctf/flag ]; then
          cp -f /ctf/flag /srv/imaging/flag.txt
        else
          printf 'FLAG{dev-asrep-lakeside}\n' > /srv/imaging/flag.txt
        fi
        chmod 0444 /srv/imaging/flag.txt
      args:
        executable: /bin/bash
      changed_when: true

    # --- run the AD DC as a service (the container runs `samba` in the foreground as PID 1) ---
    - name: Stop the standalone file-server units that conflict with the AD DC
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      failed_when: false
      loop: [smb, nmb, winbind]

    - name: Samba AD DC systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/samba-ad-dc.service
        mode: "0644"
        content: |
          [Unit]
          Description=Samba AD Domain Controller
          After=network-online.target
          Wants=network-online.target
          [Service]
          Type=notify
          NotifyAccess=all
          ExecStart=/usr/sbin/samba --foreground --no-process-group
          Restart=on-failure
          LimitNOFILE=16384
          [Install]
          WantedBy=multi-user.target

    - name: Enable and start the AD DC
      ansible.builtin.systemd:
        name: samba-ad-dc
        state: started
        enabled: true
        daemon_reload: true

    - name: Wait for the KDC to answer
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 88
        timeout: 120
