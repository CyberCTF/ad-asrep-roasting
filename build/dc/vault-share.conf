
# The flag lives here. Only svc-scanner (and Domain Admins) may open the share, so the flag is
# reachable only once svc-scanner's password has been recovered by AS-REP roasting.
[imaging]
   path = /srv/imaging
   read only = yes
   browseable = yes
   valid users = LAKESIDE\svc-scanner, @"LAKESIDE\Domain Admins"
